          'light-paper': 1,
          'light-mist': 1,
          'light-sand': 1,
          'light-mint': 1,
        };
        var lang = localStorage.getItem('robotos-setup-guide-lang');

            document.documentElement.setAttribute('data-page-preset', preset);

        var codeAttr = 'github-light';

          codeAttr = t === 'dark' ? 'solarized-dark' : 'solarized-light';

          codeStyle === 'monokai' ||
          codeStyle === 'dracula' ||
          codeStyle === 'nord' ||
          codeStyle === 'one-dark'
